<!DOCTYPE html>
<html>
<head>

    <title>Design and Typography System</title>

    <style>

        :root {

            --primary-color: #2563eb;
            --secondary-color: #1e293b;
            --background-color: #f1f5f9;
            --card-color: white;
            --text-color: #334155;

            --font-family: Arial, sans-serif;

            --heading-size: 32px;
            --paragraph-size: 16px;
            --button-size: 16px;

            --bold: 700;
            --normal: 400;

            --line-height: 1.6;

            --spacing-small: 10px;
            --spacing-medium: 20px;
            --spacing-large: 40px;
        }


        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background-color:
                var(--background-color);

            font-family:
                var(--font-family);

            color:
                var(--text-color);

            line-height:
                var(--line-height);
        }


        header {

            background-color:
                var(--secondary-color);

            color: white;

            padding:
                var(--spacing-large);

            text-align: center;
        }


        h1 {

            font-size:
                var(--heading-size);

            font-weight:
                var(--bold);
        }


        p {

            font-size:
                var(--paragraph-size);

            font-weight:
                var(--normal);
        }


        .container {

            padding:
                var(--spacing-large);
        }


        .card {

            background-color:
                var(--card-color);

            padding:
                var(--spacing-medium);

            margin-bottom:
                var(--spacing-medium);

            border-radius: 10px;
        }


        button {

            background-color:
                var(--primary-color);

            color: white;

            border: none;

            padding:
                var(--spacing-small)
                var(--spacing-medium);

            font-size:
                var(--button-size);

            font-weight:
                var(--bold);

            border-radius: 5px;

            cursor: pointer;
        }

    </style>

</head>

<body>

<header>

    <h1>Atharv Tyagi</h1>

    <p>
        My Design and Typography System
    </p>

</header>


<main class="container">

    <div class="card">

        <h2>Web Development</h2>

        <p>
            This card uses reusable CSS variables
            for typography, spacing and colors.
        </p>

        <button>
            Learn More
        </button>

    </div>


    <div class="card">

        <h2>Programming</h2>

        <p>
            CSS variables make the design consistent
            throughout the webpage.
        </p>

        <button>
            View Project
        </button>

    </div>

</main>

<footer>

    <p>
        Email: atharv.tyagi1308@gmail.com
    </p>

    <p>
        Phone: 9019886234
    </p>

</footer>

</body>
</html>
