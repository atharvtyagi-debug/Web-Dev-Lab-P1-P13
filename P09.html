<!DOCTYPE html>
<html>
<head>

    <title>Responsive Navbar and Card Grid</title>

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background-color: #f1f5f9;
        }


        nav {

            display: flex;

            justify-content: space-between;

            align-items: center;

            background-color: #222;

            padding: 20px;
        }


        .logo {

            color: white;

            font-size: 24px;

            font-weight: bold;
        }


        .links {

            display: flex;

            gap: 25px;
        }


        .links a {

            color: white;

            text-decoration: none;
        }


        .cards {

            display: flex;

            flex-wrap: wrap;

            gap: 20px;

            padding: 40px;

            justify-content: center;
        }


        .card {

            background-color: white;

            padding: 25px;

            width: 250px;

            border-radius: 10px;

            box-shadow: 0 2px 10px gray;
        }


        @media (max-width: 600px) {

            nav {

                flex-direction: column;

                gap: 15px;
            }


            .links {

                flex-direction: column;

                text-align: center;

                gap: 10px;
            }


            .cards {

                flex-direction: column;

                align-items: center;
            }


            .card {

                width: 90%;
            }

        }

    </style>

</head>

<body>


<nav>

    <div class="logo">

        Atharv Tyagi

    </div>


    <div class="links">

        <a href="#">Home</a>

        <a href="#">About</a>

        <a href="#">Projects</a>

        <a href="#">Contact</a>

    </div>

</nav>


<section class="cards">


    <div class="card">

        <h2>HTML</h2>

        <p>
            Creating webpage structures.
        </p>

    </div>


    <div class="card">

        <h2>CSS</h2>

        <p>
            Designing and styling websites.
        </p>

    </div>


    <div class="card">

        <h2>Java</h2>

        <p>
            Learning programming.
        </p>

    </div>


    <div class="card">

        <h2>DSA</h2>

        <p>
            Solving programming problems.
        </p>

    </div>


    <div class="card">

        <h2>Web Development</h2>

        <p>
            Building websites.
        </p>

    </div>


</section>


<footer>

    <p>
        Email: atharv.tyagi1308@gmail.com
    </p>

    <p>
        Phone: 9019886234
    </p>

</footer>


</body>
</html>
